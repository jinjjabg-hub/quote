# PR 마다 테스트: 계산 엔진(tests/) + 서버 함수(functions/test/). 배포는 하지 않는다.
name: 테스트

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: 계산 엔진 테스트
        run: npm test
      - name: 서버 함수 테스트
        working-directory: functions
        run: npm ci && npm test
