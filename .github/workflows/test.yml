# PR 마다 테스트: 계산 엔진(tests/) + 서버 함수(functions/test/). 배포는 하지 않는다.
name: 테스트

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: 계산 엔진 테스트
        run: npm test
      - name: 서버 함수 테스트
        working-directory: functions
        run: npm ci && npm test

  # 보안 규칙 테스트 (Firestore·Storage 에뮬레이터). 규칙을 고칠 때 되돌림을 잡는 유일한 장치 (감사 2026-11-21)
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/emulator/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: 에뮬레이터 캐시
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ hashFiles('tests/emulator/package-lock.json') }}
      - name: 보안 규칙 테스트
        working-directory: tests/emulator
        run: npm ci && npm test
