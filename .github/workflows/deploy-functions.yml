# 서버 함수 자동 배포: main 에 functions/ 변경이 머지되면 Firebase 에 배포한다.
# 인증은 Workload Identity (키 파일 없음). 1회 설정: scripts/setup-github-deploy.sh (배포.md ⑤)
# 키(JUSO_SEARCH_KEY·JUSO_DETAIL_KEY·BLD_KEY)는 Secret Manager 에만 있고, 이 작업은 값을 읽지 않는다.
name: 서버 함수 배포

on:
  push:
    branches: [main]
    paths: ['functions/**', 'firebase.json', '.github/workflows/deploy-functions.yml']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # Google 에 GitHub 신원 증명 (Workload Identity)

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  PROJECT: quote-640f4
  # 설정 스크립트 마지막 줄의 값 (비밀값 아님). 비어 있으면 테스트만 하고 배포는 건너뛴다.
  GCP_WIF_PROVIDER: projects/700989757565/locations/global/workloadIdentityPools/github/providers/github-quote
  GCP_DEPLOY_SA: github-deploy@quote-640f4.iam.gserviceaccount.com
  # 배포할 함수 목록. 새 함수를 만들면 여기에 추가 (목록에 없는 함수는 건드리지 않음)
  FUNCTIONS: functions:areaLookup

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - name: 함수 테스트
        working-directory: functions
        run: npm ci && npm test
      - name: 설정 확인
        id: cfg
        run: |
          if [ -z "$GCP_WIF_PROVIDER" ]; then
            echo "::notice::자동 배포 설정 전이라 배포를 건너뜁니다 (배포.md ⑤ 설정 스크립트)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Google Cloud 인증
        if: steps.cfg.outputs.ready == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.GCP_WIF_PROVIDER }}
          service_account: ${{ env.GCP_DEPLOY_SA }}
      - name: Firebase 배포
        if: steps.cfg.outputs.ready == 'true'
        run: npx --yes firebase-tools@13.35.1 deploy --only "$FUNCTIONS" --project "$PROJECT" --non-interactive
